name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -e ".[test]"
      - name: Lint and format check
        run: pip install ruff && ruff check . && ruff format --check .
      - name: Tests (fake AnkiConnect only - no Anki, no network)
        run: python -m pytest -v
      - name: Demo session (real server process over stdio, fake Anki)
        run: python demo.py --no-open
